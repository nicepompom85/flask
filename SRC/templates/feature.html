<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Antigravity Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .feature-card {
            text-align: center;
            padding: 3.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .feature-icon-container {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 25px var(--primary-glow);
            margin-bottom: 0.5rem;
            animation: bounce 2s infinite alternate ease-in-out;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .feature-icon-container i {
            width: 40px;
            height: 40px;
        }
        .feature-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .feature-message {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 500px;
            line-height: 1.6;
        }
        .btn-back {
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-normal);
            text-decoration: none;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-secondary);
            transform: translateX(-4px);
        }
        .btn-back i {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <main class="dashboard-container">
        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <i data-lucide="layers"></i>
                </div>
                <div>
                    <h1>Antigravity Dashboard</h1>
                    <p class="subtitle">Python Flask Modern Task Manager</p>
                </div>
            </div>
            <div class="status-badge" id="server-status">
                <span class="pulse-indicator"></span>
                <span>Active on Port 19191</span>
            </div>
        </header>

        <!-- Navigation Bar -->
        <nav class="dashboard-nav">
            <a href="/" class="nav-item"><i data-lucide="layout-dashboard"></i><span>儀表板</span></a>
            <a href="/feature1" class="nav-item {% if title == '早上看股票' %}active{% endif %}"><i data-lucide="trending-up"></i><span>早上看股票</span></a>
            <a href="/feature2" class="nav-item {% if title == '找下午上班公司' %}active{% endif %}"><i data-lucide="briefcase"></i><span>下午找公司</span></a>
            <a href="/feature3" class="nav-item"><i data-lucide="cloud-lightning"></i><span>S3 檔案管理</span></a>
        </nav>

        <!-- Reusable Card -->
        <section class="workspace-card feature-card">
            <div class="feature-icon-container">
                <i data-lucide="{{ icon }}"></i>
            </div>
            <h1 class="feature-title">{{ title }}</h1>
            <p class="feature-message">{{ message }}</p>
            
            <a href="/" class="btn-back">
                <i data-lucide="arrow-left"></i>
                <span>返回儀表板</span>
            </a>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
